<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #formulario {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #e4e6ca;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .text-center {
        text-align: center;
        margin-bottom: 15px;
      }

      .pregunta-con-imagen {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .pregunta-con-imagen img {
        width: 50%;
        max-width: 300px;
        border-radius: 5px;
      }

      #espacioDespuesDelBoton {
        margin-top: 20px;
        height: 10px;
        background-color: transparent;
      }
    </style>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- CSS que encontramos por internet, parece que es bacán -->
    <link
      rel="stylesheet"
      href="https://necolas.github.io/normalize.css/8.0.1/normalize.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/estilos.css" />
  </head>
  <body>
    <div class="container mt-5">
      <form id="formulario">
        <h1 class="text-center text-success display-4 fw-bold">Formulario</h1>
        <p id="mensajeInicial" class="text-center"></p>
        <div id="contenedorPreguntas" class="mb-4"></div>
        <div class="text-center">
          <button type="submit" class="btn btn-success">
            Enviar formulario
          </button>
        </div>
        <div id="espacioDespuesDelBoton"></div>
      </form>
    </div>
    <script src="preguntas.js"></script>
    <script src="scriptexperimentos.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
